services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: hack
      POSTGRES_DB: hack
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hack"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://postgres:hack@db:5432/hack?sslmode=disable
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-sol}
      OPENAI_MODEL_FAST: ${OPENAI_MODEL_FAST:-gpt-5.4-mini}

volumes:
  pgdata:
